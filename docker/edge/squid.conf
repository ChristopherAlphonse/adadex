# Deny by default. Only HTTPS tunnels (CONNECT :443) to domains in allowlist.txt pass.
# No plain HTTP, no other ports, no caching, no forwarded client info.
http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

http_access deny !SSL_ports
http_access deny !CONNECT
http_access allow CONNECT allowed_domains
http_access deny all

cache deny all
# The container has no capabilities, so the ICMP pinger cannot open its raw socket. Nothing uses it.
pinger_enable off
forwarded_for delete
via off
pid_filename none
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
coredump_dir /tmp
