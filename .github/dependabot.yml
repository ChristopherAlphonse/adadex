version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - patch
      minor-updates:
        patterns:
          - "*"
        update-types:
          - minor
      major-updates:
        patterns:
          - "*"
        update-types:
          - major
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    reviewers:
      - christopheralphonse
    ignore:
      - dependency-name: node-pty

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
