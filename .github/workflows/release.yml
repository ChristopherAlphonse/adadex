name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version to release. 'current' releases the version already in package.json without bumping it."
        required: true
        type: choice
        default: patch
        options:
          - current
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/_quality.yml

  publish:
    name: Version & Release
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native build tools
        run: sudo apt-get install -y python3 make g++

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Work out the version first and refuse to continue if its tag already exists,
      # so a re-run can never overwrite or duplicate a release.
      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" != "current" ]; then
            npm version "$BUMP" --no-git-tag-version
          fi
          VERSION="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Pick a bump or set a new version in package.json."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Build and package before anything is pushed: a failed build leaves no commit or tag.
      - run: npm run build

      - name: Package artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: tar -czf "adadex-$VERSION.tar.gz" bin/ dist/ README.md package.json

      - name: Commit and tag
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$BUMP" != "current" ]; then
            git add package.json package-lock.json
            git commit -m "chore: release ${VERSION#v}"
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" "adadex-$VERSION.tar.gz" \
            --generate-notes \
            --title "$VERSION" \
            --verify-tag
