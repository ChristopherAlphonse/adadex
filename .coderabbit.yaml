# CodeRabbit is off for this repo: no automatic reviews, no summaries, no status comments.
# Mention `@coderabbitai review` on a PR if you ever want a one-off review.
reviews:
  auto_review:
    enabled: false
  review_status: false
  high_level_summary: false
  poem: false
  collapse_walkthrough: true
chat:
  auto_reply: false
